server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: card-service
          uri: ${CARD_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/audio-cards,/audio-cards/**

        - id: sound-service
          uri: ${SOUND_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/sound/**,/api/v1/music/**,/api/v1/voice-recordings/**
