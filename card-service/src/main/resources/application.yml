server:
  port: 8082

spring:
  application:
    name: card-service

  datasource:
    url: jdbc:postgresql://localhost:5432/audio_card_db
    username: postgres
    password: admin
    driverClassName: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

app:
  sound-service-url: ${SOUND_SERVICE_URL:http://localhost:8083}
  card-image:
    storage-dir: ${APP_CARD_IMAGE_STORAGE_DIR:uploads/card-images}
  card-document:
    storage-dir: ${APP_CARD_DOCUMENT_STORAGE_DIR:uploads/card-documents}
