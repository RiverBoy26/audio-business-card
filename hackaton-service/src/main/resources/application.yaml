spring:
  application:
    name: hackaton-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:hackaton;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8084}

app:
  card-service-url: ${CARD_SERVICE_URL:http://localhost:8082}
