server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/audio_auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:12345}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  avatar:
    storage-dir: ${APP_AVATAR_STORAGE_DIR:uploads/avatars}

jwt:
  secret: ${JWT_SECRET}
  issuer: audio-business-card-auth
  access-token-ttl: 15m
  refresh-token-ttl: 7d
