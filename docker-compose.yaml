
name: audio-business-card

services:
  auth-db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - auth_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend

  card-db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: card_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - card_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d card_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend

  sound-db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: sound_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - sound_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d sound_db"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - backend

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: 8081

      DB_URL: jdbc:postgresql://auth-db:5432/auth_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}

    depends_on:
      auth-db:
        condition: service_healthy

    networks:
      - backend

  card-service:
    build:
      context: .
      dockerfile: card-service/Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://card-db:5432/card_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    depends_on:
      card-db:
        condition: service_healthy

    networks:
      - backend

  sound-service:
    build:
      context: .
      dockerfile: sound-service/Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:postgresql://sound-db:5432/sound_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

      APP_MUSIC_STORAGE_DIR: /app/storage/music

    volumes:
      - audio_storage:/app/storage

    depends_on:
      sound-db:
        condition: service_healthy

    networks:
      - backend

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile

    restart: unless-stopped

    environment:
      SERVER_PORT: 8080
      AUTH_SERVICE_URL: http://auth-service:8081
      CARD_SERVICE_URL: http://card-service:8082
      SOUND_SERVICE_URL: http://sound-service:8083
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}

    ports:
      - "8080:8080"

    depends_on:
      - auth-service
      - card-service
      - sound-service

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  auth_db_data:
  card_db_data:
  sound_db_data:
  audio_storage:
