
server:
  port: 8083

app:
  music:
    storage-dir: uploads/music
  ffmpeg:
    path: ffmpeg
  audio:
    output-dir: uploads/mixed

spring:
  application:
    name: sound-service

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:postgresql://localhost:5432/audio_sound_db
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
